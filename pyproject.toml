[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memocore"
version = "0.4.1"
description = "Local-first personal secretary backend"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0,<22.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0,<7.0",
    "pip-audit>=2.10,<3.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "detect-secrets>=1.5,<2.0",
]
live-qa = [
    "telethon>=1.36,<2.0",
]

[project.scripts]
memocore = "memocore.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memocore = ["prompts/*.md", "adapters/storage/migrations/sqlite/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ollama: tests that call a live Ollama or configured provider",
]

[tool.coverage.run]
branch = true
source = ["src/memocore"]

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
files = [
    "src/memocore/domain",
    "src/memocore/services/timeline_query_service.py",
    "src/memocore/services/backup_service.py",
    "src/memocore/services/commitment_lifecycle_service.py",
    "src/memocore/services/daily_closeout_service.py",
    "src/memocore/services/project_health_service.py",
    "src/memocore/services/work_state_service.py",
]

name: Release Gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Validate release metadata
        run: python scripts/quality/release_check.py --tag "${GITHUB_REF_NAME}" --require-changelog-version

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Lint
        run: python -m ruff check src

      - name: Static type check
        run: python -m mypy

      - name: Module size guard
        run: python scripts/quality/module_size_check.py

      - name: Documentation link check
        run: python scripts/quality/docs_link_check.py

      - name: Run migration smoke tests
        run: python -m pytest tests/integration/test_sqlite_migrations.py -q

      - name: Run offline test suite
        run: python -m pytest -q -m "not ollama" --cov=memocore --cov-report=term-missing

      - name: Dependency audit
        run: python -m pip_audit

      - name: Secret scan
        run: python scripts/quality/secret_scan_tracked.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
